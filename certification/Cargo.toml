[package]
name = "playlist-merger-certification"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "oldtime", "serde"] }
indicatif = "0.17"
console = "0.15"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
chrono-humanize = "0.2"
clap = { version = "4", features = ["derive"] }
rayon = "1"

playlist-merger = { path = "../src-tauri" }

[[bin]]
name = "certification_runner"
path = "src/main.rs"

[[bin]]
name = "subtitle_sync_cert"
path = "../subtitle_certification/certify_subtitle_sync.rs"