[package]
name = "playlist-merger"
version = "1.0.0"
description = "Ultra-fast playlist video merger"
authors = ["PlaylistMerger"]
edition = "2021"
default-run = "playlist-merger"

[lib]
name = "playlist_merger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "playlist-merger"
path = "src/main.rs"

[[bin]]
name = "subtitle-runtime-cert"
path = "src/bin/subtitle_runtime_cert.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
regex = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
anyhow = "1"
thiserror = "1"
notify = "6"
notify-debouncer-mini = "0.4"

chardetng = "0.1"
encoding_rs = "0.8"
open = "5"

# Semaphore for concurrency limiting — already covered by tokio with full features above

[target.'cfg(windows)'.dependencies]
# Native Windows disk space API — no extra crate needed, use std::os::windows
[target.'cfg(unix)'.dependencies]
# libc for statvfs on unix
libc = "0.2"

[dev-dependencies]
rand = "0.8"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
